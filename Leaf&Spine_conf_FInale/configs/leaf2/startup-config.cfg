!
hostname leaf02
!
interface Ethernet1
 description to-spine01
 no switchport
 ip address 10.0.1.2/31
 no shutdown
!
interface Ethernet2
 description to-spine02
 no switchport
 ip address 10.0.1.8/31
 no shutdown
!
interface Ethernet3
 description to-haproxy
 no switchport
 ip address 192.168.73.1/30
 no shutdown
!
interface Ethernet4
 description to-yokoso-web2
 no switchport
 ip address 192.168.43.1/30
 no shutdown
!
interface Loopback0
 ip address 10.255.0.12/32
!
router ospf 1
 redistribute connected
 network 10.0.1.2/31 area 0
 network 10.0.1.8/31 area 0
 network 192.168.73.0/30 area 0  
 network 192.168.43.0/30 area 0 
!
ip routing
write memory
end
!
management api gnmi
 transport grpc default
 no shutdown
 aaa authorization exec default local
 username gnmiuser privilege 15 secret MonMotDePasse123
!