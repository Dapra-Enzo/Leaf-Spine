!
hostname leaf03
!
interface Ethernet1
 description to-spine01
 no switchport
 ip address 10.0.1.4/31
 no shutdown
!
interface Ethernet2
 description to-spine02
 no switchport
 ip address 10.0.1.10/31
 no shutdown
!
interface Ethernet3
 description to-LDAP
 no switchport
 ip address 192.168.99.1/24
 no shutdown
!
interface Ethernet4
 description to-yokoso-web3
 no switchport
 ip address 192.168.69.1/30
 no shutdown
!
interface Loopback0
 ip address 10.255.0.13/32
!
router ospf 1
 redistribute connected
 network 10.0.1.4/31 area 0
 network 10.0.1.10/31 area 0
 network 192.168.99.0/24 area 0
 network 192.168.69.0/30 area 0
!
ip routing
write memory
end
!
management api gnmi
 transport grpc default
 no shutdown
 aaa authorization exec default local
 username gnmiuser privilege 15 secret MonMotDePasse123
!
