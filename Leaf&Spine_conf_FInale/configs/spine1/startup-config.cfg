!
hostname spine01
!
interface Ethernet1     
 description to-leaf01
 no switchport
 ip address 10.0.1.1/31
 no shutdown
!
interface Ethernet2       
 description to-leaf02
 no switchport
 ip address 10.0.1.3/31
 no shutdown
!
interface Ethernet3      
 description to-leaf03
 no switchport
 ip address 10.0.1.5/31
 no shutdown
!
interface Ethernet4       
 description to-catalyst
 no switchport
 ip address 192.168.93.9/30
 no shutdown
!
interface Loopback0       
 ip address 10.255.0.1/32
!
router ospf 1
 redistribute connected subnets
 network 10.0.1.0/31 area 0
 network 10.0.1.2/31 area 0
 network 10.0.1.4/31 area 0
 redistribute connected
 redistribute bgp
!
router bgp 64555
 redistribute ospf
 neighbor 192.168.93.10 remote-as 64555
  neighbor 192.168.93.10 update-source 192.168.93.9
  next-hop-self
  redistribute connected
!
ip routing
write memory
end
!
management api gnmi
 transport grpc default
 no shutdown
 aaa authorization exec default local
 username gnmiuser privilege 15 secret MonMotDePasse123
!
