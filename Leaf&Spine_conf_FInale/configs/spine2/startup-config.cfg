!
hostname spine02
!
interface Ethernet1       
 description to-leaf01
 no switchport
 ip address 10.0.1.7/31
 no shutdown
!
interface Ethernet2       
 description to-leaf02
 no switchport
 ip address 10.0.1.9/31
 no shutdown
!
interface Ethernet3       
 description to-leaf03
 no switchport
 ip address 10.0.1.11/31
 no shutdown
!
interface Ethernet4       
 description to-mikrotik
 no switchport
 ip address 192.168.55.1/30
 no shutdown
!
interface Loopback0
 ip address 10.255.0.2/32
!
router ospf 1
 network 10.0.1.6/31 area 0
 network 10.0.1.8/31 area 0
 network 10.0.1.10/31 area 0
 redistribute connected
 redistribute bgp
!
router bgp 64555
 redistribute ospf
 neighbor 192.168.55.2 remote-as 64555
  neighbor 192.168.55.2 update-source 192.168.55.1
  next-hop-self
  redistribute connected
!
ip routing
write memory
end
!
management api gnmi
 transport grpc default
 no shutdown
 aaa authorization exec default local
 username gnmiuser privilege 15 secret MonMotDePasse123
!
