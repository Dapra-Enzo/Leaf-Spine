version: "3"
services:
  gnmic:
    image: ghcr.io/openconfig/gnmic:latest
    command: [
      "subscribe",
      "--config", "/config/gnmic.yaml"
    ]
    volumes:
      - ./gnmic.yaml:/config/gnmic.yaml
    ports:
      - "9804:9804"

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
      image: grafana/grafana
      ports:
        - "3000:3000"
